apiVersion: batch/v1
kind: Job
metadata:
  name: s3proxy-init
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: awscli
        image: amazon/aws-cli:latest
        env:
        - name: AWS_ACCESS_KEY_ID
          value: "admin"
        - name: AWS_SECRET_ACCESS_KEY
          value: "password"
        - name: AWS_DEFAULT_REGION
          value: "us-east-1"
        command:
        - /bin/sh
        - -c
        - |
          aws --endpoint-url http://s3proxy:8000 s3api head-bucket --bucket warehouse 2>/dev/null \
            || aws --endpoint-url http://s3proxy:8000 s3 mb s3://warehouse
      initContainers:
      - name: wait-for-s3proxy
        image: busybox:1.28
        command: ['sh', '-c', 'until nc -z s3proxy 8000; do echo waiting for s3proxy; sleep 2; done']